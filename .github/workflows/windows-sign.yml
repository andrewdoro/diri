name: Windows code signing

# Authenticode-signs the .exe/.msi files in an uploaded workflow artifact with
# Azure Artifact Signing (formerly Trusted Signing), then verifies them with
# signtool and uploads "<artifact>-signed".
#
# DISABLED BY DEFAULT. There is no Windows release build on main yet; this is
# the seam the Windows packaging workflow calls once it lands. The job is
# skipped unless the repository variable DIRI_WINDOWS_SIGNING is set to
# "artifact-signing", which the maintainer does only after completing the
# setup in diri/PACKAGING.md ("Windows code signing").
#
# Authentication is GitHub OIDC federated to an Entra app registration: no
# client secret or certificate is stored in GitHub. The job runs in the
# "windows-signing" environment, so the federated credential can be scoped to
# that environment and protected with branch and reviewer rules.

on:
  workflow_call:
    inputs:
      artifact:
        description: Name of the workflow artifact holding the unsigned files
        required: true
        type: string
      run-id:
        description: Run that uploaded the artifact (empty = this run)
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      artifact:
        description: Name of the workflow artifact holding the unsigned files
        required: true
        type: string
      run-id:
        description: Run that uploaded the artifact
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign:
    name: Sign Windows artifacts (Azure Artifact Signing)
    if: vars.DIRI_WINDOWS_SIGNING == 'artifact-signing'
    runs-on: windows-2025
    timeout-minutes: 30
    environment: windows-signing
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Download unsigned artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}\diri-windows
          run-id: ${{ inputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Azure login (OIDC, no stored secret)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign with Azure Artifact Signing
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.DIRI_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.DIRI_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.DIRI_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ runner.temp }}\diri-windows
          files-folder-filter: exe,msi
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          # azure/login above is the only credential source.
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Verify every signature chains to a trusted root (warn if untimestamped)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$signTool) { throw 'Windows SDK signtool.exe not found' }
          $files = @(Get-ChildItem "$env:RUNNER_TEMP\diri-windows" -Recurse -Include *.exe,*.msi)
          if ($files.Count -eq 0) { throw 'The artifact contains no .exe or .msi files to sign' }
          foreach ($file in $files) {
            & $signTool.FullName verify /pa /all /tw $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $($file.Name)" }
          }
      - name: Upload signed artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact }}-signed
          path: ${{ runner.temp }}\diri-windows
          if-no-files-found: error
          retention-days: 14
